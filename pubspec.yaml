name: road_assist
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.10.3

dependencies:
    flutter:
        sdk: flutter

    # UI
    google_fonts: ^6.1.0
    gradient_borders: ^1.0.2
    glassmorphism: ^2.0.0
    cupertino_icons: ^1.0.8
    skeletonizer: ^2.1.2

    # State & routing
    flutter_riverpod: ^2.3.6
    go_router: ^17.0.1
    timeago: ^3.6.1

    # Firebase
    firebase_core: ^3.15.2
    cloud_firestore: ^5.4.0
    firebase_auth: ^5.3.3
    firebase_storage: ^12.4.10
    google_sign_in: ^6.2.1

    # Device & system
    url_launcher: ^6.3.2
    image_picker: ^1.1.2
    connectivity_plus: ^6.0.5
    permission_handler: ^11.3.1
    geolocator: ^13.0.4
    geocoding: ^3.0.0

    # Map
    http: ^1.2.0
    flutter_map: ^7.0.2
    flutter_map_location_marker: ^9.0.0
    latlong2: ^0.9.1

    # WebRTCs
    flutter_webrtc:
        git:
            url: https://github.com/flutter-webrtc/flutter-webrtc.git
            ref: main



dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/images/icons/
        - assets/images/illustrations/
        - assets/images/logos/

    fonts:
        - family: Nunito
          fonts:
              - asset: assets/fonts/Nunito-ExtraLight.ttf
                weight: 200
              - asset: assets/fonts/Nunito-Light.ttf
                weight: 300
              - asset: assets/fonts/Nunito-Regular.ttf
                weight: 400
              - asset: assets/fonts/Nunito-Medium.ttf
                weight: 500
              - asset: assets/fonts/Nunito-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Nunito-Bold.ttf
                weight: 700
              - asset: assets/fonts/Nunito-ExtraBold.ttf
                weight: 800
              - asset: assets/fonts/Nunito-Black.ttf
                weight: 900

              # Italic
              - asset: assets/fonts/Nunito-ExtraLightItalic.ttf
                weight: 200
                style: italic
              - asset: assets/fonts/Nunito-LightItalic.ttf
                weight: 300
                style: italic
              - asset: assets/fonts/Nunito-Italic.ttf
                weight: 400
                style: italic
              - asset: assets/fonts/Nunito-MediumItalic.ttf
                weight: 500
                style: italic
              - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
                weight: 600
                style: italic
              - asset: assets/fonts/Nunito-BoldItalic.ttf
                weight: 700
                style: italic
              - asset: assets/fonts/Nunito-ExtraBoldItalic.ttf
                weight: 800
                style: italic
              - asset: assets/fonts/Nunito-BlackItalic.ttf
                weight: 900
                style: italic
